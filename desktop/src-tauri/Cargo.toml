[package]
name = "carta-reader"
version = "2.1.9"
description = "Un lettore EPUB desktop con note ed evidenziazioni"
authors = ["Carta"]
edition = "2021"

[package.metadata.tauri-winres]
FileDescription = "Lettore EPUB Carta"
ProductName = "Carta"
OriginalFilename = "Carta.exe"
LegalCopyright = "Copyright Carta"

[lib]
name = "carta_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
llama-cpp-2 = { version = "0.1.157", features = ["sampler"] }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde_json = "1"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control"] }
