name: Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            throw "CMake is required to compile llama.cpp."
          }
          $libclang = Get-ChildItem -Path "$env:ProgramFiles\LLVM" -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $libclang) {
            throw "LLVM libclang.dll is required by bindgen."
          }
          "LIBCLANG_PATH=$($libclang.DirectoryName)" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Carta installer
        run: pnpm build

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: Carta ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
